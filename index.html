<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Trainingsplan</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="theme-color" content="#c62828">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f2f3f5;--card:#fff;--text:#16181d;--muted:#6b7280;--line:#d9dce1;--accent:#c62828;--ok:#2e9d4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111317;--card:#1c1f26;--text:#f1f2f4;--muted:#9aa1ad;--line:#2d313a;--accent:#ef5350}}
:root[data-theme="dark"]{--bg:#111317;--card:#1c1f26;--text:#f1f2f4;--muted:#9aa1ad;--line:#2d313a;--accent:#ef5350}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.35 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:4px 0 2px}h2{font-size:17px;margin:22px 0 8px}
.sub{color:var(--muted);margin-bottom:14px}
label{display:block;color:var(--muted);font-size:14px;margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;padding:18px 8px;min-height:104px;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tile b{font-size:34px}.tile span{color:var(--muted);font-size:15px}
.tile.big{min-height:140px}.tile.big i{font-style:normal;font-size:36px}.tile.big b{font-size:21px}
.tile.done{background:var(--ok);border-color:var(--ok);color:#fff}.tile.done span{color:#e6f6ea}
.banner{background:var(--ok);color:#fff;border-radius:14px;padding:14px;text-align:center;font-weight:600;margin-bottom:14px}
.link{display:block;margin:22px auto 0;background:none;border:0;color:var(--muted);font-family:inherit;font-size:17px;text-decoration:underline;padding:10px}
.back{background:none;border:0;color:var(--accent);font-family:inherit;font-size:18px;padding:6px 0 10px}
.name{font-size:56px;font-weight:700;margin:0;line-height:1}
.set{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;font-size:30px;font-weight:600;line-height:1.25}
.set small{display:block;color:var(--muted);font-size:14px;font-weight:400;margin-bottom:2px}
.wrap{text-align:center;margin:18px 0 8px}
.wrap input{width:100%;font-family:inherit;font-weight:700;font-size:96px;line-height:1.1;text-align:center;background:var(--card);color:var(--text);border:2px solid var(--line);border-radius:16px;padding:10px 0}
.kg{color:var(--muted);margin-top:4px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.steps button{font-family:inherit;font-weight:600;font-size:26px;padding:18px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.ok{width:100%;font-family:inherit;font-weight:700;font-size:22px;padding:20px;border:0;border-radius:14px;background:var(--ok);color:#fff;margin-top:10px}
.ok.bad{background:var(--accent)}
.hist{margin-top:14px;color:var(--muted);font-size:14px}
.f{width:100%;font-family:inherit;font-size:20px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);margin:4px 0 8px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}.card b{display:block;font-size:24px}.card span{color:var(--muted);font-size:12px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}.row .top{display:flex;justify-content:space-between;gap:8px}.row .top span{color:var(--muted)}
.dates{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
.acts,.seg{display:flex;gap:6px;margin-top:8px}
.acts button,.seg button{flex:1;font-family:inherit;font-size:15px;padding:12px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ghost{display:block;width:100%;font-family:inherit;font-size:18px;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);margin-top:12px}
</style>
</head>
<body>
<main id="app"></main>
<script>
const DEF=[["B3","4 | 2 | 21",190],["R3","2",190],["R4","6",130],["T1","Knie 7 · Fuß 12",50],["T2","–",70],["T3","Knie 12 · Fuß M",130],["Br7","Sitz 3 · Griff 2",200],["S3","Sitz 4",120],["B2","11",130],["B1","11",130]];
const KEY="trainingsplan_v1",$=i=>document.getElementById(i);
let S;
const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const num=v=>parseFloat(String(v).replace(",","."));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function today(){const n=new Date();return n.getFullYear()+"-"+("0"+(n.getMonth()+1)).slice(-2)+"-"+("0"+n.getDate()).slice(-2)}
function fmt(d){const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(d);return m?m[3]+"."+m[2]+"."+m[1].slice(2):d}
function norm(s){for(const k in s.hist)(s.hist[k]||[]).forEach(e=>{const m=/^(\d\d)\.(\d\d)\.(\d\d)$/.exec(e.d);if(m)e.d="20"+m[3]+"-"+m[2]+"-"+m[1]})}
function migrate(s){
 s.w=s.w||{};s.done=s.done||{};s.hist=s.hist||{};
 if(!Array.isArray(s.devs)){s.devs=DEF.map(g=>({k:g[0],n:g[0],s:(s.set&&s.set[g[0]]!==undefined)?s.set[g[0]]:g[1]}));DEF.forEach(g=>{if(s.w[g[0]]===undefined)s.w[g[0]]=g[2]});delete s.set}
 s.theme=s.theme||"auto";s.name=s.name||"";s.bw=s.bw||"";norm(s);return s}
function load(){let s={};try{s=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}return migrate(s)}
function applyTheme(){const r=document.documentElement;if(S.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",S.theme)}
function render(h){$("app").innerHTML=h;window.scrollTo(0,0)}
function two(b,fn,msg){const t=b.textContent;b.onclick=()=>{if(b.dataset.s!=="1"){b.dataset.s="1";b.textContent=msg||"Nochmal tippen zur Bestätigung";setTimeout(()=>{if(b.isConnected){b.dataset.s="";b.textContent=t}},4000)}else{b.dataset.s="";fn()}}}
function chart(a,big){
 if(a.length<2)return big?'<div class="hist">Diagramm ab 2 Einträgen</div>':'<div class="hist">–</div>';
 const W=300,H=big?130:36,p=big?24:3,ws=a.map(e=>e.w),lo=Math.min(...ws),hi=Math.max(...ws);
 let mn=lo,mx=hi;if(mn===mx){mn-=1;mx+=1}
 const xy=a.map((e,i)=>[p+i*(W-2*p)/(a.length-1),H-p-(e.w-mn)/(mx-mn)*(H-2*p)]);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block"><polyline points="${xy.map(q=>q[0].toFixed(1)+","+q[1].toFixed(1)).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
 if(big){xy.forEach(q=>{s+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3.5" fill="var(--accent)"/>`});s+=`<text x="0" y="12" font-size="11" fill="var(--muted)">${hi}</text><text x="0" y="${H-3}" font-size="11" fill="var(--muted)">${lo}</text>`}
 s+="</svg>";
 if(big)s+=`<div class="dates"><span>${fmt(a[0].d)}</span><span>${fmt(a[a.length-1].d)}</span></div>`;
 return s}

function welcome(msg){
 const T=[["training","🏋️","Training"],["stats","📈","Statistik"],["manage","🛠️","Verwaltung"],["settings","⚙️","Einstellungen"]];
 render(`${typeof msg==="string"?`<div class="banner">${msg}</div>`:""}<h1>${S.name?"Hallo, "+esc(S.name)+"!":"Willkommen"}</h1><div class="sub">Was möchtest du tun?</div><div class="grid">${T.map(t=>`<button class="tile big" data-v="${t[0]}"><i>${t[1]}</i><b>${t[2]}</b></button>`).join("")}</div>`);
 document.querySelectorAll(".big").forEach(b=>b.onclick=()=>V[b.dataset.v]())}

function training(){
 const D=S.devs,n=D.filter(d=>S.done[d.k]).length,old=n>0&&S.start&&S.start!==today();
 render(`<button class="back" id="back">‹ Start</button><h1>Training</h1><div class="sub">${n} von ${D.length} erledigt${S.start?" · Start "+fmt(S.start):""} · 1 Satz à 15 · Tempo 4-2-4</div>${old?`<div class="row"><b>Offenes Training vom ${fmt(S.start)}</b><div class="sub">${n} von ${D.length} Geräten erledigt. Fortsetzen oder neu beginnen?</div><div class="acts"><button id="oc">Fortsetzen</button><button id="on">Neu beginnen</button></div></div>`:""}${D.length&&n===D.length&&!old?'<div class="banner">Training abgeschlossen ✓</div>':""}<div class="grid">${D.map(d=>`<button class="tile${S.done[d.k]?" done":""}" data-k="${esc(d.k)}"><b>${esc(d.n)}</b><span>${S.w[d.k]} lb</span></button>`).join("")}</div>${D.length?'<button class="ok" id="fin" style="margin-top:22px">Training abschließen und speichern</button>':'<div class="sub">Noch keine Geräte. Bitte unter Verwaltung anlegen.</div>'}<button class="ghost" id="home2">‹ Zurück zum Start</button>`);
 $("back").onclick=welcome;$("home2").onclick=welcome;
 document.querySelectorAll(".tile").forEach(b=>b.onclick=()=>detail(b.dataset.k));
 if(old){$("oc").onclick=()=>{S.start=today();save();training()};$("on").onclick=()=>{S.done={};S.start=null;save();training()}}
 if($("fin")){const fin=()=>{S.done={};S.start=null;save();welcome("Training gespeichert ✓")};
  if(n===D.length)$("fin").onclick=fin;else two($("fin"),fin,(D.length-n)+" Gerät(e) offen – nochmal tippen")}}

function detail(k){
 const d=S.devs.find(x=>x.k===k),a=S.hist[k]||[];
 render(`<button class="back" id="back">‹ Übersicht</button><p class="name">${esc(d.n)}</p><div class="set"><small>Einstellung</small>${esc(d.s||"–")}</div><div class="wrap"><input id="w" type="number" inputmode="decimal" step="any" value="${S.w[k]}"><div class="kg">lb</div></div><div class="steps">${[-10,-2,2,10].map(x=>`<button data-d="${x}">${x>0?"+":"−"}${Math.abs(x)}</button>`).join("")}</div><button class="ok" id="ok">Bestätigen</button><h2>Gewichtsverlauf</h2>${chart(a,true)}${a.length?`<div class="hist">${a.slice(-5).reverse().map(e=>fmt(e.d)+" · "+e.w+" lb").join("<br>")}</div>`:""}`);
 const inp=$("w");inp.onfocus=()=>inp.select();
 document.querySelectorAll(".steps button").forEach(b=>b.onclick=()=>{const v=num(inp.value)||0;inp.value=Math.max(0,Math.round((v+Number(b.dataset.d))*10)/10)});
 $("back").onclick=training;
 $("ok").onclick=()=>{const v=num(inp.value);if(isNaN(v)||v<0){inp.focus();return}
  if(S.start!==today())S.start=today();S.w[k]=v;S.done[k]=true;const arr=S.hist[k]=S.hist[k]||[],dt=S.start;
  if(arr.length&&arr[arr.length-1].d===dt)arr[arr.length-1].w=v;else arr.push({d:dt,w:v});
  save();training()}}

function stats(){
 const days={};
 S.devs.forEach(g=>(S.hist[g.k]||[]).forEach(e=>{days[e.d]=(days[e.d]||0)+1}));
 const ds=Object.keys(days).sort(),n=ds.length;
 let h='<button class="back" id="back">‹ Start</button><h1>Statistik</h1><button class="ghost" id="past" style="margin-top:4px">+ Training nachtragen</button>';
 if(!n)h+='<div class="sub">Noch keine Trainings gespeichert.</div>';
 else{const wk=Math.max(1,Math.ceil(((new Date(ds[n-1])-new Date(ds[0]))/864e5+1)/7));
  h+=`<div class="cards"><div class="card"><b>${n}</b><span>Trainingstage</span></div><div class="card"><b>${(n/wk).toFixed(1).replace(".",",")}</b><span>Ø pro Woche</span></div><div class="card"><b>${fmt(ds[n-1])}</b><span>zuletzt</span></div></div><h2>Gewichte je Gerät</h2>`;
  S.devs.forEach(g=>{const a=S.hist[g.k]||[];if(!a.length)return;const dd=Math.round((a[a.length-1].w-a[0].w)*10)/10;
   h+=`<div class="row"><div class="top"><b>${esc(g.n)}</b><span>${a[0].w} → ${a[a.length-1].w} lb (${dd>0?"+":""}${dd})</span></div>${chart(a,false)}</div>`});
  h+="<h2>Trainingstage</h2>";
  ds.slice().reverse().forEach(d=>{h+=`<div class="row"><div class="top"><b>${new Date(d).toLocaleDateString("de-DE",{weekday:"short"})}, ${fmt(d)}</b><span>${days[d]} von ${S.devs.length} Geräten</span></div></div>`})}
 render(h);$("back").onclick=welcome;$("past").onclick=addPast}

function addPast(){
 const y=new Date(Date.now()-864e5),dflt=y.getFullYear()+"-"+("0"+(y.getMonth()+1)).slice(-2)+"-"+("0"+y.getDate()).slice(-2);
 render(`<button class="back" id="back">‹ Statistik</button><h1>Training nachtragen</h1><label>Datum</label><input class="f" id="pd" type="date" value="${dflt}" max="${today()}"><div class="sub" style="margin-top:12px">Gewicht in lb je Gerät. Leer lassen, wenn das Gerät nicht trainiert wurde.</div>${S.devs.map(d=>`<label>${esc(d.n)}</label><input class="f pw" data-k="${esc(d.k)}" type="number" inputmode="decimal" step="any" value="${S.w[d.k]}">`).join("")}<button class="ok" id="sv">Speichern</button>`);
 $("back").onclick=stats;
 $("sv").onclick=()=>{const dt=$("pd").value;if(!/^\d{4}-\d\d-\d\d$/.test(dt)){$("pd").focus();return}
  document.querySelectorAll(".pw").forEach(i=>{const v=num(i.value);if(isNaN(v)||v<0)return;const k=i.dataset.k,a=(S.hist[k]||[]).filter(e=>e.d!==dt);a.push({d:dt,w:v});a.sort((x,y)=>x.d<y.d?-1:1);S.hist[k]=a});
  save();stats()}}

function manage(){
 const D=S.devs;
 render(`<button class="back" id="back">‹ Start</button><h1>Verwaltung</h1><div class="sub">Geräte, Einstellungen und Gewichte</div>${D.map((d,i)=>`<div class="row"><div class="top"><b>${esc(d.n)}</b><span>${esc(d.s||"–")} · ${S.w[d.k]} lb</span></div><div class="acts"><button data-a="up" data-i="${i}">▲</button><button data-a="dn" data-i="${i}">▼</button><button data-a="ed" data-i="${i}">Bearbeiten</button><button data-a="del" data-i="${i}">Löschen</button></div></div>`).join("")}<button class="ok" id="add">+ Gerät hinzufügen</button>`);
 $("back").onclick=welcome;$("add").onclick=()=>editDev(null);
 document.querySelectorAll(".acts button").forEach(b=>{const i=+b.dataset.i,a=b.dataset.a;
  if(a==="del")two(b,()=>{const k=D[i].k;D.splice(i,1);delete S.w[k];delete S.done[k];delete S.hist[k];save();manage()},"Sicher?");
  else b.onclick=()=>{if(a==="ed")return editDev(D[i].k);const j=a==="up"?i-1:i+1;if(j<0||j>=D.length)return;[D[i],D[j]]=[D[j],D[i]];save();manage()}})}

function editDev(k){
 const d=k?S.devs.find(x=>x.k===k):{n:"",s:""},w=k?S.w[k]:"";
 render(`<button class="back" id="back">‹ Abbrechen</button><h1>${k?"Gerät bearbeiten":"Neues Gerät"}</h1><label>Name</label><input class="f" id="en" value="${esc(d.n)}"><label>Einstellung</label><input class="f" id="es" value="${esc(d.s)}"><label>Gewicht (lb)</label><input class="f" id="ew" type="number" inputmode="decimal" step="any" value="${w}"><button class="ok" id="sv">Speichern</button>`);
 $("back").onclick=manage;
 $("sv").onclick=()=>{const n=$("en").value.trim();if(!n){$("en").focus();return}
  const v=num($("ew").value)||0,s=$("es").value.trim();
  if(k){d.n=n;d.s=s;S.w[k]=v}else{const nk="n"+Date.now();S.devs.push({k:nk,n:n,s:s});S.w[nk]=v}
  save();manage()}}

function settings(){
 render(`<button class="back" id="back">‹ Start</button><h1>Einstellungen</h1><label>Name</label><input class="f" id="sn" value="${esc(S.name)}"><label>Körpergewicht (kg)</label><input class="f" id="sb" type="number" inputmode="decimal" step="any" value="${esc(S.bw)}"><h2>Darstellung</h2><div class="seg">${[["auto","Automatisch"],["light","Hell"],["dark","Dunkel"]].map(t=>`<button data-t="${t[0]}" class="${S.theme===t[0]?"on":""}">${t[1]}</button>`).join("")}</div><h2>Datensicherung</h2><div class="sub">Sicherung anzeigen, kopieren und z. B. in Notizen ablegen. Zum Wiederherstellen Text einfügen und Einspielen.</div><textarea class="f" id="bk" rows="5"></textarea><div class="acts"><button id="show">Anzeigen</button><button id="cp">Kopieren</button><button id="rs">Einspielen</button></div><div class="sub" id="msg"></div><h2>Verlauf</h2><button class="ok bad" id="clr">Verlauf zurücksetzen</button>`);
 const m=t=>{$("msg").textContent=t};
 $("back").onclick=welcome;
 $("sn").oninput=()=>{S.name=$("sn").value.trim();save()};
 $("sb").oninput=()=>{S.bw=$("sb").value;save()};
 document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{S.theme=b.dataset.t;save();applyTheme();settings()});
 $("show").onclick=()=>{$("bk").value=JSON.stringify(S);m("")};
 $("cp").onclick=()=>{const v=JSON.stringify(S);$("bk").value=v;try{navigator.clipboard.writeText(v).then(()=>m("Kopiert."),()=>{$("bk").select();m("Bitte Text manuell kopieren.")})}catch(e){$("bk").select();m("Bitte Text manuell kopieren.")}};
 two($("rs"),()=>{try{const p=JSON.parse($("bk").value);if(!p||!Array.isArray(p.devs)||!p.w)throw 0;S=migrate(p);save();applyTheme();settings();$("msg").textContent="Wiederhergestellt."}catch(e){m("Sicherungstext ungültig.")}},"Sicher?");
 two($("clr"),()=>{S.hist={};S.done={};S.start=null;save();m("Verlauf gelöscht.")},"Nochmal tippen zur Bestätigung")}

const V={training,stats,manage,settings};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
S=load();applyTheme();welcome();
</script>
</body>
</html>
